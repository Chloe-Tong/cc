<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cc · Web Chat</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141210;--card:#1c1814;--card2:#241f1a;
  --accent:#f2b83b;--accent2:#e8a828;--accent-bg:rgba(242,184,59,0.12);
  --text:#ede4d8;--dim:#7a7068;--dimmer:#3a3530;--sep:rgba(255,255,255,0.06);
  --user-bg:#181410;--asst-bg:#2a1a0e;--asst-text:#f0d0b0;
  --task-bg:rgba(255,255,255,0.03);--input-bg:#181410;--bar-bg:rgba(12,10,8,0.95);
  --code-bg:#0d0c0a;--r:16px;--r-sm:10px;--r-xs:6px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:768px;margin:0 auto;position:relative}

/* Header */
#hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;border-bottom:1px solid var(--sep);background:var(--bg);flex-shrink:0;z-index:10}
#hdr-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
#dot{width:8px;height:8px;border-radius:50%;background:#45d94f;transition:background .3s}
#dot.off{background:var(--dim)}
#dot.busy{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#hdr-sub{font-size:12px;color:var(--dim)}

/* Views */
.view{display:none;flex:1;overflow:hidden;flex-direction:column}
.view.on{display:flex}

/* Tab bar */
#tabbar{display:flex;background:var(--bar-bg);border-top:1px solid var(--sep);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;cursor:pointer;color:var(--dim);font-size:10px;border:none;background:none;-webkit-tap-highlight-color:transparent;transition:color .15s}
.tab.on{color:var(--accent)}
.tab svg{width:22px;height:22px}

/* ── Chat ── */
#chat-msgs{flex:1;overflow-y:auto;padding:12px 12px 4px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
.time-sep{text-align:center;color:var(--dim);font-size:11px;padding:8px 0 4px}

/* Bubbles */
.row{display:flex;flex-direction:column;gap:2px}
.row.user{align-items:flex-end}
.row.assistant{align-items:flex-start}
.row.task{align-items:stretch}
.bubble{max-width:82%;padding:10px 13px;border-radius:var(--r);line-height:1.55;word-break:break-word}
.row.user .bubble{background:var(--user-bg);border:1px solid rgba(255,255,255,0.06);border-bottom-right-radius:var(--r-xs);color:var(--text)}
.row.assistant .bubble{background:var(--asst-bg);border:1px solid rgba(242,120,40,0.12);border-bottom-left-radius:var(--r-xs);color:var(--asst-text)}

/* Task rows */
.task-bubble{background:var(--task-bg);border:1px solid var(--sep);border-radius:var(--r-sm);padding:7px 12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
.task-icon{flex-shrink:0;width:18px;text-align:center;font-style:normal}
.task-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-stack{background:var(--task-bg);border:1px solid var(--sep);border-radius:var(--r-sm);overflow:hidden}
.task-stack-row{display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--sep)}
.task-stack-row:last-child{border-bottom:none}

/* Thinking chip */
.think-chip{max-width:82%;background:var(--card);border:1px solid rgba(242,184,59,.18);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;cursor:pointer;margin-bottom:3px}
.think-chip-hdr{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:12px}
.think-chip-body{display:none;white-space:pre-wrap;margin-top:6px;color:var(--dim);font-size:12px}
.think-chip.open .think-chip-body{display:block}

/* Msg meta row */
.msg-meta{display:flex;align-items:center;gap:6px;padding:0 3px}
.row.user .msg-meta{flex-direction:row-reverse}
.msg-ts{font-size:11px;color:var(--dimmer)}
.msg-acts{display:none;gap:4px}
.row:hover .msg-acts{display:flex}
.act-btn{background:none;border:none;color:var(--dimmer);cursor:pointer;padding:2px 5px;border-radius:4px;font-size:13px;transition:color .15s;line-height:1}
.act-btn:hover,.act-btn.on{color:var(--accent)}

/* Thinking bar */
#think-bar{display:none;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--sep);background:var(--bg);color:var(--dim);font-size:13px;flex-shrink:0}
#think-bar.on{display:flex}
.tdots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 1.5px;animation:dbounce 1.2s ease-in-out infinite}
.tdots span:nth-child(2){animation-delay:.18s}
.tdots span:nth-child(3){animation-delay:.36s}
@keyframes dbounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}

/* Scroll FAB */
#fab{position:absolute;bottom:72px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--sep);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#fab.on{opacity:1;pointer-events:auto}

/* Code blocks */
.cblk{position:relative;background:var(--code-bg);border:1px solid var(--sep);border-radius:var(--r-xs);margin:6px 0;overflow:hidden}
.clang{font-size:11px;color:var(--dim);padding:5px 10px 0;font-family:'SF Mono','Fira Code',monospace}
.cblk pre{font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:12.5px;line-height:1.6;padding:8px 10px 10px;overflow-x:auto;white-space:pre;color:#d4d4d4}
.ccopy{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:var(--dim);font-size:11px;padding:3px 8px;cursor:pointer;transition:all .15s}
.ccopy:hover{background:rgba(255,255,255,.14)}
.ccopy.ok{color:#45d94f}
code{font-family:'SF Mono','Fira Code',monospace;font-size:.88em;background:rgba(255,255,255,.06);border-radius:4px;padding:1px 5px}

/* Markdown */
.md h1,.md h2,.md h3{font-weight:600;margin:8px 0 4px}
.md h1{font-size:1.1em}.md h2{font-size:1.05em}.md h3{font-size:1em}
.md p{margin:4px 0}.md ul,.md ol{margin:4px 0 4px 16px}.md li{margin:2px 0}
.md strong{font-weight:600}.md em{font-style:italic}
.md a{color:var(--accent);text-decoration:none}
.md blockquote{border-left:3px solid var(--accent);padding-left:10px;color:var(--dim);margin:6px 0}
.md hr{border:none;border-top:1px solid var(--sep);margin:8px 0}
.md table{border-collapse:collapse;font-size:13px;margin:6px 0;width:100%;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--sep);padding:5px 8px;text-align:left}
.md th{background:rgba(255,255,255,.04);font-weight:600}

/* Chat input */
#chat-inp-area{flex-shrink:0;padding:8px 12px;border-top:1px solid var(--sep);background:var(--bg)}
#slash-pop{background:var(--card);border:1px solid var(--sep);border-radius:var(--r-sm);padding:4px;margin-bottom:6px;display:none}
#slash-pop.on{display:block}
.sl-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-xs);cursor:pointer;transition:background .1s}
.sl-item:hover,.sl-item.sel{background:var(--accent-bg)}
.sl-cmd{font-weight:600;color:var(--accent);font-size:14px}
.sl-desc{color:var(--dim);font-size:12px}
#chat-row{display:flex;gap:8px;align-items:flex-end}
#chat-inp{flex:1;background:var(--input-bg);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-sm);color:var(--text);font-size:15px;padding:10px 13px;resize:none;min-height:42px;max-height:120px;font-family:inherit;outline:none;transition:border-color .15s}
#chat-inp:focus{border-color:rgba(242,184,59,.3)}
#chat-inp::placeholder{color:var(--dim)}
#send-btn{width:42px;height:42px;border-radius:var(--r-sm);background:var(--accent);border:none;color:#141210;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s,transform .1s}
#send-btn:active{transform:scale(.93)}
#send-btn:disabled{opacity:.4;cursor:default}

/* ── Terminal ── */
#term-sess-bar{display:flex;gap:6px;padding:10px 12px 8px;overflow-x:auto;border-bottom:1px solid var(--sep);flex-shrink:0}
#term-sess-bar::-webkit-scrollbar{height:0}
.stab{padding:5px 12px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;border:1px solid var(--sep);color:var(--dim);background:none;transition:all .15s;font-family:'SF Mono',monospace}
.stab.on{background:var(--accent-bg);border-color:rgba(242,184,59,.3);color:var(--accent)}
#term-out-wrap{flex:1;overflow:auto;padding:10px 12px;background:var(--code-bg)}
#term-out{font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:12.5px;line-height:1.55;color:#d4d4d4;white-space:pre;word-break:break-all;min-height:100%}
#term-keys{display:flex;gap:6px;padding:8px 12px 4px;overflow-x:auto;flex-shrink:0;border-top:1px solid var(--sep)}
#term-keys::-webkit-scrollbar{height:0}
.kbtn{padding:5px 11px;border-radius:20px;font-size:12px;font-family:'SF Mono',monospace;cursor:pointer;white-space:nowrap;border:1px solid rgba(255,255,255,.1);color:var(--dim);background:var(--card);transition:all .12s;-webkit-tap-highlight-color:transparent}
.kbtn:active{background:var(--accent-bg);color:var(--accent)}
#term-inp-row{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--sep);align-items:center;flex-shrink:0}
.t-prompt{color:var(--accent);font-family:'SF Mono',monospace;font-size:13px;flex-shrink:0}
#term-inp{flex:1;background:none;border:none;color:#d4d4d4;font-family:'SF Mono','Fira Code',monospace;font-size:13px;outline:none}
#term-inp::placeholder{color:var(--dimmer)}
#term-sbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:18px;padding:2px 6px}

/* ── Favorites ── */
#fav-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.fav-card{background:var(--card);border:1px solid var(--sep);border-radius:var(--r-sm);padding:12px;display:flex;gap:10px}
.fav-meta{font-size:11px;color:var(--dim);margin-bottom:5px}
.fav-txt{font-size:14px;color:var(--text);white-space:pre-wrap;word-break:break-word;line-height:1.5}
.fav-del{background:none;border:none;color:var(--dimmer);cursor:pointer;font-size:16px;flex-shrink:0;padding:2px;line-height:1;transition:color .15s}
.fav-del:hover{color:#ff5c5c}

/* Empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);gap:12px;font-size:14px}
.empty-ico{font-size:44px;opacity:.4}

/* Toast */
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--card2);color:var(--text);padding:9px 18px;border-radius:20px;font-size:13px;pointer-events:none;opacity:0;transition:all .2s;z-index:200;white-space:nowrap;border:1px solid var(--sep)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Scrollbars */
*::-webkit-scrollbar{width:3px;height:3px}
*::-webkit-scrollbar-thumb{background:var(--dimmer);border-radius:2px}
*::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">

<div id="hdr">
  <div id="hdr-title"><div id="dot"></div><span>Cc · Web Chat</span></div>
  <span id="hdr-sub">连接中…</span>
</div>

<!-- Chat -->
<div id="view-chat" class="view on">
  <div id="chat-msgs"></div>
  <div id="think-bar">
    <div class="tdots"><span></span><span></span><span></span></div>
    <span id="think-verb">思考中…</span>
  </div>
  <div id="chat-inp-area">
    <div id="slash-pop"></div>
    <div id="chat-row">
      <textarea id="chat-inp" rows="1" placeholder="发消息给 Cc (Enter 发送)"></textarea>
      <button id="send-btn"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  </div>
</div>

<!-- Terminal -->
<div id="view-term" class="view">
  <div id="term-sess-bar"><button class="stab on">cc</button></div>
  <div id="term-out-wrap"><div id="term-out">连接中…</div></div>
  <div id="term-keys">
    <button class="kbtn" data-key="Escape">Esc</button>
    <button class="kbtn" data-key="Up">↑</button>
    <button class="kbtn" data-keys="Up,Up">↑↑</button>
    <button class="kbtn" data-key="Down">↓</button>
    <button class="kbtn" data-key="Return">↵ Enter</button>
    <button class="kbtn" data-key="Tab">Tab</button>
    <button class="kbtn" data-key="C-c">^C</button>
    <button class="kbtn" data-key="C-l">^L</button>
    <button class="kbtn" data-key="C-d">^D</button>
  </div>
  <div id="term-inp-row">
    <span class="t-prompt">$</span>
    <input id="term-inp" type="text" placeholder="输入命令…" autocomplete="off" spellcheck="false">
    <button id="term-sbtn">↵</button>
  </div>
</div>

<!-- Favorites -->
<div id="view-fav" class="view">
  <div id="fav-list"><div class="empty"><div class="empty-ico">⭐</div><div>加载中…</div></div></div>
</div>

<!-- Tab bar -->
<div id="tabbar">
  <button class="tab on" data-tab="chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    对话
  </button>
  <button class="tab" data-tab="term">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
    终端
  </button>
  <button class="tab" data-tab="fav">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    收藏
  </button>
</div>
</div><!-- #app -->

<div id="toast"></div>
<div id="fab" onclick="scrollToBottom(true)">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────
const P = new URLSearchParams(location.search);
const TOKEN = P.get('token') || '';
const BASE  = location.origin;

// ── State ────────────────────────────────────────────────────────────────
let msgs     = [];
let lastTs   = null;
let thinking = false;
let curTab   = 'chat';
let termSess = 'cc';
let termList = [];
let favs     = [];
let favIds   = new Set();
let atBot    = true;
let termTmr  = null;
let verbTmr  = null;
let verbIdx  = 0;
let slashSel = 0;

const VERBS = ['思考中…','分析中…','规划中…','推理中…','理解中…','Thinking…','Analyzing…','Planning…'];

const SLASH = [
  {cmd:'/new',    desc:'新建 Claude 会话'},
  {cmd:'/stop',   desc:'中止当前任务'},
  {cmd:'/clear',  desc:'清空对话历史'},
  {cmd:'/list',   desc:'列出所有会话'},
  {cmd:'/switch', desc:'切换会话 (需加 ID)'},
  {cmd:'/compact',desc:'压缩上下文'},
];

// ── API ──────────────────────────────────────────────────────────────────
async function api(path, opts={}) {
  const r = await fetch(BASE + path, {
    ...opts,
    headers: { 'X-Auth-Token': TOKEN, ...(opts.headers||{}) },
  });
  if (!r.ok) throw new Error(r.status);
  const ct = r.headers.get('content-type')||'';
  if (ct.includes('json')) return r.json();
  return r.text();
}

// ── Toast ────────────────────────────────────────────────────────────────
let tTmr = null;
function toast(msg, ms=2200) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(tTmr);
  tTmr = setTimeout(() => el.classList.remove('on'), ms);
}

// ── Tab switching ────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(b =>
  b.addEventListener('click', () => switchTab(b.dataset.tab))
);
function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id==='view-'+tab));
  if (tab==='term') { loadTermSessions(); startTermPoll(); }
  else stopTermPoll();
  if (tab==='fav') loadFavs();
}

// ── Tool icon mapping ────────────────────────────────────────────────────
function taskIcon(t) {
  t = (t||'').toLowerCase();
  if (/read|open|view/.test(t))          return '📄';
  if (/write|edit|updat|modif/.test(t))  return '✏️';
  if (/creat|new|add/.test(t))           return '➕';
  if (/delet|remov|trash/.test(t))       return '🗑️';
  if (/bash|exec|run|command|shell/.test(t)) return '⌨️';
  if (/git|commit|push|branch|merge/.test(t)) return '⎇';
  if (/test|spec|check/.test(t))         return '✅';
  if (/search|find|grep|glob/.test(t))   return '🔍';
  if (/install|npm|pip|brew|yarn/.test(t)) return '⬇️';
  if (/fix|debug|error|bug/.test(t))     return '🔧';
  if (/deploy|release|publish|build/.test(t)) return '🚀';
  if (/api|request|fetch|http/.test(t))  return '🌐';
  if (/config|setting|env/.test(t))      return '⚙️';
  if (/list|ls|dir/.test(t))             return '📋';
  if (/move|rename|copy/.test(t))        return '📁';
  if (/download|curl|wget/.test(t))      return '⬇️';
  if (/upload/.test(t))                  return '⬆️';
  if (/start|launch|spawn/.test(t))      return '▶️';
  if (/stop|kill|abort/.test(t))         return '⏹️';
  return '🔹';
}

// ── HTML escaping ────────────────────────────────────────────────────────
function esc(s)  { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ea(s)   { return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n'); }

// ── Markdown ────────────────────────────────────────────────────────────
function md(text) {
  let h = esc(text);
  h = h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g,'<em>$1</em>');
  h = h.replace(/~~(.+?)~~/g,'<del>$1</del>');
  h = h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  h = h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h = h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  h = h.replace(/^---+$/gm,'<hr>');
  // Tables
  h = h.replace(/(\|.+\|\n\|[-| :]+\|\n(?:\|.+\|\n?)+)/g, m => {
    const lines = m.trim().split('\n');
    let th = '<tr>' + lines[0].split('|').filter((_,i,a)=>i>0&&i<a.length-1).map(c=>`<th>${c.trim()}</th>`).join('') + '</tr>';
    let tb = lines.slice(2).map(l=>'<tr>'+l.split('|').filter((_,i,a)=>i>0&&i<a.length-1).map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>').join('');
    return `<table><thead>${th}</thead><tbody>${tb}</tbody></table>`;
  });
  // Lists
  h = h.replace(/^[*-] (.+)$/gm,'<li>$1</li>');
  h = h.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)+/g,'<ul>$&</ul>');
  // Paragraphs
  h = h.split(/\n\n+/).map(p => {
    if (/^<(h[1-3]|ul|ol|blockquote|hr|table)/.test(p.trim())) return p;
    return '<p>' + p.replace(/\n/g,'<br>') + '</p>';
  }).join('');
  return h;
}

// ── Parse code blocks ────────────────────────────────────────────────────
function parseSegs(text) {
  const out = [];
  const re = /```(\w*)\n?([\s\S]*?)```/g;
  let last=0, m;
  while ((m=re.exec(text))!==null) {
    if (m.index>last) out.push({type:'text', s:text.slice(last,m.index)});
    out.push({type:'code', lang:m[1]||'', s:m[2]});
    last = re.lastIndex;
  }
  if (last<text.length) out.push({type:'text', s:text.slice(last)});
  return out;
}

function renderSegs(text) {
  return parseSegs(text).map(seg => {
    if (seg.type==='code') {
      const id='cb'+Math.random().toString(36).slice(2);
      return `<div class="cblk">${seg.lang?`<div class="clang">${esc(seg.lang)}</div>`:''}
        <pre id="${id}">${esc(seg.s)}</pre>
        <button class="ccopy" onclick="cpCode('${id}',this)">复制</button></div>`;
    }
    return `<div class="md">${md(seg.s)}</div>`;
  }).join('');
}

function cpCode(id, btn) {
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='已复制'; btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='复制';btn.classList.remove('ok')},2000);
  });
}

// ── Time formatting ──────────────────────────────────────────────────────
function fmtTs(ts) {
  if (!ts) return '';
  const d=new Date(ts), now=new Date(), diff=now-d;
  if (isNaN(d)) return '';
  if (diff<60000) return '刚刚';
  if (diff<3600000) return Math.floor(diff/60000)+'分钟前';
  if (d.toDateString()===now.toDateString()) return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtDate(ts) {
  if (!ts) return '';
  const d=new Date(ts), now=new Date();
  if (isNaN(d)) return '';
  if (d.toDateString()===now.toDateString()) return '今天';
  const y=now.getFullYear()-d.getFullYear();
  return d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',...(y?{year:'numeric'}:{})});
}

// ── Render single message ────────────────────────────────────────────────
function renderMsg(msg) {
  const role=msg.role||'assistant';
  if (role==='task') {
    return `<div class="row task"><div class="task-bubble">
      <i class="task-icon">${taskIcon(msg.text)}</i>
      <span class="task-text">${esc(msg.text)}</span>
    </div></div>`;
  }
  const isU=role==='user';
  const starred=favIds.has(msg.id);
  const tsStr=fmtTs(msg.timestamp);
  let thinkHtml='';
  if (msg.thinking) {
    const prev=msg.thinking.slice(0,50);
    thinkHtml=`<div class="think-chip" onclick="this.classList.toggle('open')">
      <div class="think-chip-hdr">💭 <span style="font-weight:normal;color:var(--dim)">${esc(prev)}${msg.thinking.length>50?'…':''}</span></div>
      <div class="think-chip-body">${esc(msg.thinking)}</div>
    </div>`;
  }
  const iid=CSS.escape(msg.id);
  return `<div class="row ${role}" data-id="${esc(msg.id)}">
    ${!isU&&msg.thinking?thinkHtml:''}
    <div class="bubble">${renderSegs(msg.text||'')}</div>
    <div class="msg-meta">
      <span class="msg-ts">${tsStr}</span>
      <div class="msg-acts">
        <button class="act-btn${starred?' on':''}" onclick="toggleFav('${ea(msg.id)}','${ea(msg.text)}','${role}','${ea(msg.timestamp||'')}',this)" title="${starred?'取消收藏':'收藏'}">
          ${starred?'★':'☆'}
        </button>
        <button class="act-btn" onclick="cpTxt('${ea(msg.text)}')" title="复制">⎘</button>
      </div>
    </div>
  </div>`;
}

// ── Render chat ──────────────────────────────────────────────────────────
const chatEl = document.getElementById('chat-msgs');

chatEl.addEventListener('scroll', () => {
  const d=chatEl.scrollHeight-chatEl.scrollTop-chatEl.clientHeight;
  atBot = d<80;
  document.getElementById('fab').classList.toggle('on', d>300);
});
function scrollToBottom(force) {
  if (force||atBot) chatEl.scrollTop=chatEl.scrollHeight;
}

function renderChat() {
  if (!msgs.length) {
    chatEl.innerHTML='<div class="empty"><div class="empty-ico">💬</div><div>还没有消息</div></div>';
    return;
  }
  const rows=[];
  let taskBuf=[], lastDate='';

  function flushTasks() {
    if (!taskBuf.length) return;
    if (taskBuf.length===1) { rows.push({type:'msg',msg:taskBuf[0]}); }
    else rows.push({type:'taskstack',tasks:[...taskBuf]});
    taskBuf=[];
  }

  for (const msg of msgs) {
    const d=fmtDate(msg.timestamp);
    if (d && d!==lastDate) { flushTasks(); rows.push({type:'sep',label:d}); lastDate=d; }
    if (msg.role==='task') taskBuf.push(msg);
    else { flushTasks(); rows.push({type:'msg',msg}); }
  }
  flushTasks();

  let html='';
  for (const r of rows) {
    if (r.type==='sep') {
      html+=`<div class="time-sep">${r.label}</div>`;
    } else if (r.type==='taskstack') {
      html+=`<div class="row task"><div class="task-stack">`;
      for (const t of r.tasks)
        html+=`<div class="task-stack-row"><i class="task-icon">${taskIcon(t.text)}</i><span class="task-text">${esc(t.text)}</span></div>`;
      html+=`</div></div>`;
    } else {
      html+=renderMsg(r.msg);
    }
  }
  chatEl.innerHTML=html;
  scrollToBottom();
}

// ── Poll chat ────────────────────────────────────────────────────────────
async function pollChat() {
  try {
    let newMsgs=[], statusData=null;
    const since = lastTs ? `&since=${encodeURIComponent(lastTs)}` : '';

    // Try /chat/poll (returns {messages,status} or array)
    try {
      const data = await api(`/chat/poll?limit=50${since}`);
      if (Array.isArray(data)) { newMsgs=data; }
      else { newMsgs=data.messages||[]; statusData=data.status; }
    } catch(_) {
      // Fallback to /chat/history
      try { newMsgs = await api(`/chat/history?limit=100${since}`); }
      catch(_2) {}
    }

    // Get status separately if not in poll response
    if (!statusData) {
      try { statusData = await api('/chat/status'); } catch(_) {}
    }

    // Update thinking state
    const wasThink=thinking;
    thinking = !!(statusData?.typing||statusData?.thinking||statusData?.status==='thinking');

    const thinkBar=document.getElementById('think-bar');
    const dot=document.getElementById('dot');
    if (thinking) {
      dot.className='busy'; thinkBar.classList.add('on');
      if (!wasThink) { verbIdx=0; clearInterval(verbTmr); verbTmr=setInterval(()=>{ verbIdx=(verbIdx+1)%VERBS.length; document.getElementById('think-verb').textContent=VERBS[verbIdx]; },2500); }
    } else {
      dot.className=''; thinkBar.classList.remove('on');
      clearInterval(verbTmr); verbTmr=null;
    }

    // Merge new messages
    if (newMsgs.length) {
      const ids=new Set(msgs.map(m=>m.id));
      let changed=false;
      for (const m of newMsgs) {
        if (!ids.has(m.id)) { msgs.push(m); ids.add(m.id); changed=true; }
        if (m.isFavorited) favIds.add(m.id);
      }
      if (!lastTs) changed=true;
      msgs.sort((a,b)=>{
        const ta=new Date(a.timestamp||0).getTime(), tb=new Date(b.timestamp||0).getTime();
        return ta-tb||(a.id>b.id?1:-1);
      });
      const last=msgs[msgs.length-1];
      if (last?.timestamp) lastTs=last.timestamp;
      if (changed) renderChat();
    }

    document.getElementById('hdr-sub').textContent='在线 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    document.getElementById('dot').className='off';
    document.getElementById('hdr-sub').textContent='离线';
  }
}

// ── Send chat ────────────────────────────────────────────────────────────
const chatInp=document.getElementById('chat-inp');
const sendBtn=document.getElementById('send-btn');

async function sendChat() {
  const text=chatInp.value.trim();
  if (!text||sendBtn.disabled) return;
  if (text.startsWith('/')) { chatInp.value=''; autoResize(); document.getElementById('slash-pop').classList.remove('on'); await handleSlash(text); return; }
  chatInp.value=''; autoResize();
  sendBtn.disabled=true;
  const local={id:'local-'+Date.now(),role:'user',text,timestamp:new Date().toISOString()};
  msgs.push(local);
  renderChat(); scrollToBottom(true);
  try {
    await api('/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  } catch(e) {
    toast('发送失败: '+e.message);
    msgs=msgs.filter(m=>m.id!==local.id);
    renderChat();
  } finally { sendBtn.disabled=false; chatInp.focus(); }
}

function autoResize() {
  chatInp.style.height='auto';
  chatInp.style.height=Math.min(chatInp.scrollHeight,120)+'px';
}

// ── Slash commands ───────────────────────────────────────────────────────
async function handleSlash(text) {
  const [base,...args]=text.trim().split(/\s+/);
  try {
    if (base==='/new')    { await api('/chain/new_session',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); toast('已新建会话'); }
    else if (base==='/stop')   { await api('/chain/abort',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); toast('已中止'); }
    else if (base==='/clear')  { await api('/chain/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); msgs=[]; lastTs=null; renderChat(); toast('已清空'); }
    else if (base==='/list')   { const d=await api('/chain/sessions'); const s=d.sessions||d; toast('共 '+((Array.isArray(s)?s:[]).length)+' 个会话'); }
    else if (base==='/switch') { if (!args[0]){toast('用法: /switch <id>');return;} await api('/chain/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:args[0]})}); toast('已切换'); }
    else if (base==='/compact'){ await api('/tmux/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keys:'/compact',session:termSess,enter:true})}); toast('已发送 /compact'); }
    else toast('未知命令: '+base);
  } catch(e) { toast('命令失败: '+e.message); }
}

// Slash popup
const slashPop=document.getElementById('slash-pop');
chatInp.addEventListener('input', () => {
  autoResize();
  const val=chatInp.value;
  if (val.startsWith('/')&&!val.includes(' ')) {
    const q=val.slice(1).toLowerCase();
    const filtered=SLASH.filter(s=>s.cmd.slice(1).startsWith(q));
    if (filtered.length) { slashSel=0; renderSlash(filtered); slashPop.classList.add('on'); }
    else slashPop.classList.remove('on');
  } else slashPop.classList.remove('on');
});

function currentSlash() {
  const val=chatInp.value;
  if (!val.startsWith('/')) return [];
  const q=val.slice(1).toLowerCase();
  return SLASH.filter(s=>s.cmd.slice(1).startsWith(q));
}

function renderSlash(cmds) {
  slashPop.innerHTML=cmds.map((c,i)=>
    `<div class="sl-item${i===slashSel?' sel':''}" onclick="applySlash('${c.cmd}')">
      <span class="sl-cmd">${c.cmd}</span><span class="sl-desc">${c.desc}</span>
    </div>`
  ).join('');
}

function applySlash(cmd) {
  chatInp.value=cmd+' '; slashPop.classList.remove('on'); chatInp.focus();
}

chatInp.addEventListener('keydown', e => {
  if (slashPop.classList.contains('on')) {
    const items=currentSlash();
    if (e.key==='ArrowDown'){e.preventDefault();slashSel=Math.min(slashSel+1,items.length-1);renderSlash(items);return;}
    if (e.key==='ArrowUp'){e.preventDefault();slashSel=Math.max(slashSel-1,0);renderSlash(items);return;}
    if (e.key==='Tab'||e.key==='Enter'){e.preventDefault();if(items[slashSel])applySlash(items[slashSel].cmd);return;}
    if (e.key==='Escape'){slashPop.classList.remove('on');return;}
  }
  if (e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
});

sendBtn.addEventListener('click', sendChat);

function cpTxt(t) {
  navigator.clipboard.writeText(t.replace(/\\n/g,'\n')).then(()=>toast('已复制'));
}

// ── Favorites ────────────────────────────────────────────────────────────
async function toggleFav(id, text, role, ts, btn) {
  const on=favIds.has(id);
  try {
    if (on) {
      await api('/chat/favorites/'+id,{method:'DELETE'});
      favIds.delete(id); btn.textContent='☆'; btn.classList.remove('on'); toast('已取消收藏');
    } else {
      await api('/chat/favorites',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({refs:[{id,role,text:text.replace(/\\n/g,'\n'),ts,type:'text'}],type:'text'})});
      favIds.add(id); btn.textContent='★'; btn.classList.add('on'); toast('已收藏');
    }
  } catch(e) { toast('操作失败: '+e.message); }
}

async function loadFavs() {
  const el=document.getElementById('fav-list');
  el.innerHTML='<div class="empty"><div class="empty-ico">⭐</div><div>加载中…</div></div>';
  try {
    const data=await api('/chat/favorites');
    favs=Array.isArray(data)?data:(data.favorites||data.items||[]);
    renderFavs();
  } catch(e) { el.innerHTML='<div class="empty"><div class="empty-ico">⭐</div><div>加载失败</div></div>'; }
}

function renderFavs() {
  const el=document.getElementById('fav-list');
  if (!favs.length){el.innerHTML='<div class="empty"><div class="empty-ico">⭐</div><div>还没有收藏</div></div>';return;}
  el.innerHTML=favs.map(f=>{
    const role=f.role==='user'?'我':'Cc';
    const ts=fmtTs(f.ts||f.timestamp||f.created_at);
    const txt=(f.text||'').slice(0,400);
    return `<div class="fav-card">
      <div style="flex:1">
        <div class="fav-meta">${role} · ${ts}</div>
        <div class="fav-txt">${esc(txt)}${(f.text||'').length>400?'…':''}</div>
      </div>
      <button class="fav-del" onclick="delFav('${ea(f.id)}',this)">✕</button>
    </div>`;
  }).join('');
}

async function delFav(id, btn) {
  try {
    await api('/chat/favorites/'+id,{method:'DELETE'});
    favs=favs.filter(f=>f.id!==id); favIds.delete(id); renderFavs(); toast('已删除');
  } catch(e) { toast('删除失败'); }
}

// ── Terminal ─────────────────────────────────────────────────────────────
async function loadTermSessions() {
  try {
    const data=await api('/tmux/sessions');
    termList=data.sessions||[];
    if (!termList.length) return;
    if (!termList.find(s=>s.name===termSess)) termSess=termList[0].name;
    const bar=document.getElementById('term-sess-bar');
    bar.innerHTML=termList.map(s=>
      `<button class="stab${s.name===termSess?' on':''}" onclick="selSess('${ea(s.name)}')">${esc(s.name)}</button>`
    ).join('');
  } catch(_) {}
}

function selSess(name) {
  termSess=name;
  document.querySelectorAll('.stab').forEach(b=>b.classList.toggle('on',b.textContent===name));
  pollTerm();
}

async function pollTerm() {
  if (curTab!=='term') return;
  try {
    const data=await api(`/tmux/capture?session=${encodeURIComponent(termSess)}&lines=120`);
    if (data&&data.output!==undefined) {
      document.getElementById('term-out').textContent=data.output;
      const w=document.getElementById('term-out-wrap');
      w.scrollTop=w.scrollHeight;
    }
  } catch(_) {}
}

function startTermPoll() { stopTermPoll(); pollTerm(); termTmr=setInterval(pollTerm,1500); }
function stopTermPoll()  { clearInterval(termTmr); termTmr=null; }

async function sendTerm() {
  const inp=document.getElementById('term-inp');
  const text=inp.value; if (!text) return;
  inp.value='';
  try {
    await api('/tmux/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({keys:text,session:termSess,enter:true})});
    setTimeout(pollTerm,400);
  } catch(e) { toast('发送失败: '+e.message); }
}

async function sendKey(key) {
  try {
    await api('/tmux/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({key,session:termSess})});
    setTimeout(pollTerm,300);
  } catch(_) {}
}

async function sendKeys(keys) {
  for (const k of keys) {
    await sendKey(k);
    await new Promise(r=>setTimeout(r,80));
  }
}

document.querySelectorAll('.kbtn').forEach(btn => {
  btn.addEventListener('click', ()=>{
    const key=btn.dataset.key;
    const keys=btn.dataset.keys;
    if (keys) sendKeys(keys.split(','));
    else sendKey(key);
  });
});

document.getElementById('term-inp').addEventListener('keydown', e=>{
  if (e.key==='Enter'){e.preventDefault();sendTerm();}
});
document.getElementById('term-sbtn').addEventListener('click', sendTerm);

// ── Start ────────────────────────────────────────────────────────────────
pollChat();
setInterval(pollChat, 2000);
</script>
