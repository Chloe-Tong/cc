<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cc · Web Chat</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#14100d;color:#ede4d8;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;position:relative}

/* ── Header ── */
#hdr{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.06);background:#14100d;flex-shrink:0}
#hdr-av{width:32px;height:32px;border-radius:50%;background:#f2b83b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#14100d;flex-shrink:0}
#hdr-info{flex:1}
#hdr-name{font-weight:600;font-size:15px;line-height:1.2}
#hdr-sub{font-size:11px;color:#7a7068;display:flex;align-items:center;gap:5px;margin-top:1px}
#dot{width:6px;height:6px;border-radius:50%;background:#45d94f;transition:background .3s;flex-shrink:0}
#dot.off{background:#3a3530}#dot.busy{background:#f2b83b;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── Views ── */
.view{display:none;flex:1;overflow:hidden;flex-direction:column}
.view.on{display:flex}

/* ── Tab bar ── */
#tabbar{display:flex;background:rgba(10,8,6,.96);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;cursor:pointer;color:#5a5248;font-size:10px;border:none;background:none;-webkit-tap-highlight-color:transparent;transition:color .15s;position:relative}
.tab.on{color:#f2b83b}
.tab svg{width:22px;height:22px}
.tab-badge{position:absolute;top:6px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:#f2b83b;color:#14100d;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
.tab-badge.on{display:flex}

/* ── Chat messages ── */
#chat-msgs{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:0}
#chat-msgs::-webkit-scrollbar{width:3px}
#chat-msgs::-webkit-scrollbar-thumb{background:#2a2420;border-radius:2px}

/* Time separator */
.time-sep{text-align:center;color:#5a5248;font-size:11px;padding:14px 0 8px}

/* Message group: avatar + bubbles column */
.msg-group{display:flex;gap:8px;margin-bottom:12px}
.msg-group.user{flex-direction:row-reverse}
.msg-group.task{flex-direction:column;margin-bottom:4px}

/* Avatar */
.av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:2px;align-self:flex-end}
.av.cc{background:#d96b35;color:#fff} /* assistant: warm orange */
.av.me{background:#2a2218;border:1px solid rgba(255,255,255,.08);color:#ede4d8}

/* Bubble column */
.bubbles{display:flex;flex-direction:column;gap:3px;max-width:78%}
.msg-group.user .bubbles{align-items:flex-end}
.msg-group.assistant .bubbles{align-items:flex-start}

/* Individual bubble */
.bubble{padding:10px 13px;border-radius:18px;line-height:1.58;word-break:break-word;position:relative}

/* User bubble: dark subtle */
.bubble.user{background:#1e1a16;border:1px solid rgba(255,255,255,0.07);color:#ede4d8;border-bottom-right-radius:5px}
/* First bubble in group rounded more */
.bubbles .bubble.user:first-child{border-top-right-radius:18px}
.bubbles .bubble.user:last-child{border-bottom-right-radius:5px}

/* Assistant bubble: warm orange — matches ccAssistant night #d96b35 bg opacity */
.bubble.assistant{background:#3d1e0f;border:1px solid rgba(217,107,53,.18);color:#f0d0b0;border-bottom-left-radius:5px}
.bubbles .bubble.assistant:first-child{border-top-left-radius:18px}
.bubbles .bubble.assistant:last-child{border-bottom-left-radius:5px}

/* Bubble timestamp */
.bts{font-size:11px;color:#3a3530;margin-top:2px;padding:0 3px}
.msg-group.user .bts{text-align:right}

/* Bubble hover actions */
.bubble-wrap{position:relative;display:flex;flex-direction:column}
.bact{display:none;flex-direction:row;gap:2px;padding:2px 3px}
.msg-group.user .bact{justify-content:flex-end}
.bubble-wrap:hover .bact{display:flex}
.bab{background:none;border:none;color:#3a3530;cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px;transition:color .15s;line-height:1}
.bab:hover,.bab.on{color:#f2b83b}

/* Task bubble */
.task-group{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.task-row{display:flex;align-items:center;gap:10px;padding:7px 12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);border-radius:10px;font-size:13px;color:#5a5248}
.task-row:not(:first-child){border-top-color:rgba(255,255,255,.03)}
.task-ico{flex-shrink:0;width:18px;text-align:center}
.task-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Stack of task rows */
.task-stack{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);border-radius:10px;overflow:hidden}
.task-stack .task-row{border:none;border-bottom:1px solid rgba(255,255,255,.04);border-radius:0}
.task-stack .task-row:last-child{border-bottom:none}

/* Thinking chip */
.think-chip{background:#1c1814;border:1px solid rgba(242,184,59,.2);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;margin-bottom:4px;max-width:88%}
.think-hdr{display:flex;align-items:center;gap:6px;color:#f2b83b;font-size:12px}
.think-body{display:none;white-space:pre-wrap;margin-top:6px;color:#7a7068;font-size:12px;line-height:1.5}
.think-chip.open .think-body{display:block}

/* Thinking bar */
#think-bar{display:none;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid rgba(255,255,255,.06);background:#14100d;color:#7a7068;font-size:13px;flex-shrink:0}
#think-bar.on{display:flex}
.tdots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#f2b83b;margin:0 1.5px;animation:dbounce 1.2s ease-in-out infinite}
.tdots span:nth-child(2){animation-delay:.18s}
.tdots span:nth-child(3){animation-delay:.36s}
@keyframes dbounce{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-5px);opacity:1}}

/* Scroll FAB */
#fab{position:absolute;bottom:76px;right:16px;width:36px;height:36px;border-radius:50%;background:#241f1a;border:1px solid rgba(255,255,255,.08);color:#ede4d8;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 16px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#fab.on{opacity:1;pointer-events:auto}

/* Code blocks */
.cblk{background:#0a0908;border:1px solid rgba(255,255,255,.06);border-radius:8px;margin:6px 0;overflow:hidden;position:relative}
.clang{font-size:11px;color:#5a5248;padding:5px 10px 0;font-family:'SF Mono','Fira Code',monospace}
.cblk pre{font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:12.5px;line-height:1.6;padding:8px 10px 10px;overflow-x:auto;white-space:pre;color:#d4d4d4;tab-size:2}
.ccopy{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:5px;color:#5a5248;font-size:11px;padding:3px 8px;cursor:pointer;transition:all .15s}
.ccopy:hover{background:rgba(255,255,255,.12)}
.ccopy.ok{color:#45d94f}
code{font-family:'SF Mono','Fira Code',monospace;font-size:.88em;background:rgba(255,255,255,.07);border-radius:4px;padding:1px 5px}

/* Markdown */
.md p{margin:3px 0;line-height:1.58}.md p:first-child{margin-top:0}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{font-weight:600;margin:8px 0 4px;line-height:1.3}
.md h1{font-size:1.1em}.md h2{font-size:1.05em}.md h3{font-size:1em}
.md ul,.md ol{margin:4px 0 4px 16px}.md li{margin:2px 0}
.md strong{font-weight:600}.md em{font-style:italic}.md del{text-decoration:line-through;opacity:.7}
.md a{color:#f2b83b;text-decoration:none}.md a:hover{text-decoration:underline}
.md blockquote{border-left:3px solid #f2b83b;padding-left:10px;color:#7a7068;margin:6px 0}
.md hr{border:none;border-top:1px solid rgba(255,255,255,.06);margin:8px 0}
.md table{border-collapse:collapse;font-size:13px;margin:6px 0;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid rgba(255,255,255,.08);padding:5px 8px;text-align:left;white-space:nowrap}
.md th{background:rgba(255,255,255,.04);font-weight:600}

/* Chat input */
#chat-foot{flex-shrink:0;padding:8px 12px;border-top:1px solid rgba(255,255,255,.06);background:#14100d}
#slash-pop{background:#1c1814;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:4px;margin-bottom:6px;display:none}
#slash-pop.on{display:block}
.sl-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;transition:background .1s}
.sl-item:hover,.sl-item.sel{background:rgba(242,184,59,.1)}
.sl-cmd{font-weight:600;color:#f2b83b;font-size:14px;min-width:80px}
.sl-desc{color:#5a5248;font-size:12px}
#chat-row{display:flex;gap:8px;align-items:flex-end}
#chat-inp{flex:1;background:#1a1612;border:1px solid rgba(255,255,255,.08);border-radius:22px;color:#ede4d8;font-size:15px;padding:10px 16px;resize:none;min-height:42px;max-height:130px;font-family:inherit;outline:none;transition:border-color .2s;line-height:1.4}
#chat-inp:focus{border-color:rgba(242,184,59,.35)}
#chat-inp::placeholder{color:#3a3530}
#send-btn{width:42px;height:42px;border-radius:50%;background:#f2b83b;border:none;color:#14100d;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s,opacity .15s}
#send-btn:active{transform:scale(.9)}
#send-btn:disabled{opacity:.4;cursor:default}

/* ── Terminal ── */
#term-sess{display:flex;gap:6px;padding:10px 12px 8px;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
#term-sess::-webkit-scrollbar{height:0}
.stab{padding:5px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;white-space:nowrap;border:1px solid rgba(255,255,255,.07);color:#5a5248;background:none;transition:all .15s;font-family:'SF Mono',monospace}
.stab.on{background:rgba(242,184,59,.12);border-color:rgba(242,184,59,.3);color:#f2b83b}
#term-wrap{flex:1;overflow:auto;padding:12px}
#term-out{font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:12.5px;line-height:1.55;color:#d4d4d4;white-space:pre;word-break:break-all;min-height:100%}
#term-keys{display:flex;gap:6px;padding:8px 12px 4px;overflow-x:auto;flex-shrink:0;border-top:1px solid rgba(255,255,255,.06)}
#term-keys::-webkit-scrollbar{height:0}
.kbtn{padding:5px 12px;border-radius:20px;font-size:12px;font-family:'SF Mono',monospace;cursor:pointer;white-space:nowrap;border:1px solid rgba(255,255,255,.09);color:#5a5248;background:#1a1612;transition:all .12s;-webkit-tap-highlight-color:transparent}
.kbtn:active,.kbtn:hover{background:rgba(242,184,59,.1);color:#f2b83b;border-color:rgba(242,184,59,.25)}
#term-foot{display:flex;gap:8px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.06);align-items:center;flex-shrink:0}
.t-ps{color:#f2b83b;font-family:'SF Mono',monospace;font-size:13px;flex-shrink:0}
#term-inp{flex:1;background:none;border:none;color:#d4d4d4;font-family:'SF Mono','Fira Code',monospace;font-size:13px;outline:none}
#term-inp::placeholder{color:#2a2420}
#term-sbtn{background:none;border:none;color:#f2b83b;cursor:pointer;font-size:18px;padding:2px 6px;line-height:1}

/* ── Favorites ── */
#fav-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.fav-card{background:#1a1612;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:13px;display:flex;gap:10px}
.fav-meta{font-size:11px;color:#5a5248;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.fav-role{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:700}
.fav-role.cc{background:#d96b35;color:#fff}
.fav-role.me{background:#2a2218;border:1px solid rgba(255,255,255,.08);color:#ede4d8}
.fav-txt{font-size:14px;color:#c8bfb4;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.fav-del{background:none;border:none;color:#2a2420;cursor:pointer;font-size:16px;flex-shrink:0;padding:2px;line-height:1;transition:color .15s;align-self:flex-start}
.fav-del:hover{color:#ff5c5c}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3a3530;gap:14px;font-size:14px}
.empty-ico{font-size:46px;opacity:.35}

/* Toast */
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(12px);background:#241f1a;color:#ede4d8;padding:9px 20px;border-radius:20px;font-size:13px;pointer-events:none;opacity:0;transition:all .2s;z-index:200;white-space:nowrap;border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 20px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

*::-webkit-scrollbar{width:3px;height:3px}
*::-webkit-scrollbar-thumb{background:#2a2218;border-radius:2px}
*::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">

<!-- Header -->
<div id="hdr">
  <div id="hdr-av">Cc</div>
  <div id="hdr-info">
    <div id="hdr-name">Cc</div>
    <div id="hdr-sub"><div id="dot"></div><span id="hdr-st">连接中…</span></div>
  </div>
</div>

<!-- Chat -->
<div id="view-chat" class="view on">
  <div id="chat-msgs"></div>
  <div id="think-bar">
    <div class="tdots"><span></span><span></span><span></span></div>
    <span id="think-verb">思考中…</span>
  </div>
  <div id="chat-foot">
    <div id="slash-pop"></div>
    <div id="chat-row">
      <textarea id="chat-inp" rows="1" placeholder="发消息给 Cc…"></textarea>
      <button id="send-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Terminal -->
<div id="view-term" class="view">
  <div id="term-sess"><button class="stab on">cc</button></div>
  <div id="term-wrap"><div id="term-out">连接中…</div></div>
  <div id="term-keys">
    <button class="kbtn" data-key="Escape">Esc</button>
    <button class="kbtn" data-key="Up">↑</button>
    <button class="kbtn" data-keys="Up,Up">↑↑</button>
    <button class="kbtn" data-key="Down">↓</button>
    <button class="kbtn" data-key="Return">↵</button>
    <button class="kbtn" data-key="Tab">Tab</button>
    <button class="kbtn" data-key="C-c">^C</button>
    <button class="kbtn" data-key="C-l">^L</button>
    <button class="kbtn" data-key="C-d">^D</button>
  </div>
  <div id="term-foot">
    <span class="t-ps">$</span>
    <input id="term-inp" type="text" placeholder="输入命令…" autocomplete="off" spellcheck="false">
    <button id="term-sbtn">↵</button>
  </div>
</div>

<!-- Favorites -->
<div id="view-fav" class="view">
  <div id="fav-list"><div class="empty"><div class="empty-ico">⭐</div><div>加载中…</div></div></div>
</div>

<!-- Tab bar -->
<div id="tabbar">
  <button class="tab on" data-tab="chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    对话
  </button>
  <button class="tab" data-tab="term">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
    终端
  </button>
  <button class="tab" data-tab="fav">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    收藏
  </button>
</div>
</div>

<div id="toast"></div>
<div id="fab" onclick="scrollBot(true)">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
</div>

<script>
// ── Config ───────────────────────────────────────────────────────────────
// AUTH_TOKEN injected by push.py _serve_web_chat() → highest priority
const _injected = typeof AUTH_TOKEN !== 'undefined' ? AUTH_TOKEN : '';
const _urlToken  = new URLSearchParams(location.search).get('token') || '';
const _stored    = localStorage.getItem('cc_token') || '';
const TOKEN = _injected || _urlToken || _stored;
if (TOKEN) localStorage.setItem('cc_token', TOKEN);
const BASE  = location.origin;

// ── State ────────────────────────────────────────────────────────────────
let msgs=[], lastTs=null, isThink=false, curTab='chat';
let termSess='cc', termList=[], favs=[], favIds=new Set();
let atBot=true, termTmr=null, verbTmr=null, verbIdx=0, slashSel=0;

const VERBS=['思考中…','分析中…','规划中…','推理中…','理解中…','Thinking…','Analyzing…','Planning…','Reasoning…'];
const SLASH=[
  {cmd:'/new',desc:'新建 Claude 会话'},{cmd:'/stop',desc:'中止当前任务'},
  {cmd:'/clear',desc:'清空对话历史'},{cmd:'/list',desc:'列出所有会话'},
  {cmd:'/switch',desc:'切换会话（加 ID）'},{cmd:'/compact',desc:'压缩上下文'},
];

// ── API ──────────────────────────────────────────────────────────────────
async function api(path,opts={}){
  const r=await fetch(BASE+path,{...opts,headers:{'X-Auth-Token':TOKEN,...(opts.headers||{})}});
  if(!r.ok) throw new Error(r.status);
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():r.text();
}

// ── Toast ────────────────────────────────────────────────────────────────
let tTmr=null;
function toast(msg,ms=2200){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(tTmr);tTmr=setTimeout(()=>el.classList.remove('on'),ms);
}

// ── Tabs ─────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='view-'+tab));
  if(tab==='term'){loadTermSess();startTermPoll();}else stopTermPoll();
  if(tab==='fav') loadFavs();
}

// ── Tool icons ───────────────────────────────────────────────────────────
function ico(t){
  t=(t||'').toLowerCase();
  if(/read|open|view/.test(t))return'📄';
  if(/write|edit|updat|modif/.test(t))return'✏️';
  if(/creat|new(?! sess)/.test(t))return'➕';
  if(/delet|remov|trash/.test(t))return'🗑️';
  if(/bash|exec|run|command|shell/.test(t))return'⌨️';
  if(/git|commit|push|branch|merge/.test(t))return'⎇';
  if(/test|spec/.test(t))return'✅';
  if(/search|find|grep|glob/.test(t))return'🔍';
  if(/install|npm|pip|brew|yarn/.test(t))return'⬇️';
  if(/fix|debug|error|bug/.test(t))return'🔧';
  if(/deploy|release|publish/.test(t))return'🚀';
  if(/api|request|fetch|http/.test(t))return'🌐';
  if(/config|setting/.test(t))return'⚙️';
  if(/build|compil/.test(t))return'🔨';
  if(/list|ls$/.test(t))return'📋';
  if(/move|rename|copy/.test(t))return'📁';
  return'🔹';
}

// ── Escaping ─────────────────────────────────────────────────────────────
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ea(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');}

// ── Markdown ─────────────────────────────────────────────────────────────
function renderMd(raw){
  let h=esc(raw);
  h=h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  h=h.replace(/~~(.+?)~~/g,'<del>$1</del>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/^---+$/gm,'<hr>');
  // Tables
  const tableRe=/(\|.+\|[ \t]*\n\|[-| :]+\|[ \t]*\n(?:\|.+\|[ \t]*\n?)+)/g;
  h=h.replace(tableRe,m=>{
    const rows=m.trim().split('\n');
    const cols=r=>r.split('|').filter((_,i,a)=>i>0&&i<a.length-1).map(c=>c.trim());
    const th='<tr>'+cols(rows[0]).map(c=>`<th>${c}</th>`).join('')+'</tr>';
    const tb=rows.slice(2).map(r=>'<tr>'+cols(r).map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
    return`<table><thead>${th}</thead><tbody>${tb}</tbody></table>`;
  });
  h=h.replace(/^[*-] (.+)$/gm,'<li>$1</li>');
  h=h.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>[\s\S]*?<\/li>)+/g,'<ul>$&</ul>');
  h=h.split(/\n\n+/).map(p=>{
    if(/^<(h[1-3]|ul|ol|blockquote|hr|table)/.test(p.trim()))return p;
    return'<p>'+p.replace(/\n/g,'<br>')+'</p>';
  }).join('');
  return h;
}

// ── Code block parser ─────────────────────────────────────────────────────
function parseSegs(text){
  const out=[];const re=/```(\w*)\n?([\s\S]*?)```/g;
  let last=0,m;
  while((m=re.exec(text))!==null){
    if(m.index>last)out.push({t:'text',s:text.slice(last,m.index)});
    out.push({t:'code',lang:m[1]||'',s:m[2]});
    last=re.lastIndex;
  }
  if(last<text.length)out.push({t:'text',s:text.slice(last)});
  return out;
}
function renderSegs(text){
  return parseSegs(text).map(seg=>{
    if(seg.t==='code'){
      const id='c'+Math.random().toString(36).slice(2);
      return`<div class="cblk">${seg.lang?`<div class="clang">${esc(seg.lang)}</div>`:''}
        <pre id="${id}">${esc(seg.s)}</pre>
        <button class="ccopy" onclick="cpCode('${id}',this)">复制</button></div>`;
    }
    return`<div class="md">${renderMd(seg.s)}</div>`;
  }).join('');
}
function cpCode(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='已复制';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='复制';btn.classList.remove('ok');},2000);
  });
}

// ── Time ─────────────────────────────────────────────────────────────────
function fmtTs(ts){
  if(!ts)return'';const d=new Date(ts),now=new Date(),diff=now-d;
  if(isNaN(d))return'';
  if(diff<60000)return'刚刚';
  if(diff<3600000)return Math.floor(diff/60000)+'分钟前';
  if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtDate(ts){
  if(!ts)return'';const d=new Date(ts),now=new Date();
  if(isNaN(d))return'';
  if(d.toDateString()===now.toDateString())return'今天';
  const y=now.getFullYear()-d.getFullYear();
  return d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',...(y?{year:'numeric'}:{})});
}

// ── Chat rendering ────────────────────────────────────────────────────────
const chatEl=document.getElementById('chat-msgs');
chatEl.addEventListener('scroll',()=>{
  const d=chatEl.scrollHeight-chatEl.scrollTop-chatEl.clientHeight;
  atBot=d<80;
  document.getElementById('fab').classList.toggle('on',d>300);
});
function scrollBot(force){if(force||atBot)chatEl.scrollTop=chatEl.scrollHeight;}

function renderChat(){
  if(!msgs.length){
    chatEl.innerHTML='<div class="empty"><div class="empty-ico">💬</div><div>还没有消息</div></div>';
    return;
  }

  // Group messages
  const groups=[];
  let taskBuf=[],lastDate='',lastRole=null,lastGroup=null;

  function flushTasks(){
    if(!taskBuf.length)return;
    groups.push({type:'tasks',items:[...taskBuf]});
    taskBuf=[];lastRole=null;lastGroup=null;
  }

  for(const msg of msgs){
    const d=fmtDate(msg.timestamp);
    if(d&&d!==lastDate){flushTasks();groups.push({type:'sep',label:d});lastDate=d;lastRole=null;lastGroup=null;}
    if(msg.role==='task'){taskBuf.push(msg);}
    else{
      flushTasks();
      if(lastRole===msg.role&&lastGroup){
        lastGroup.bubbles.push(msg);
      }else{
        const g={type:'group',role:msg.role,bubbles:[msg]};
        groups.push(g);lastGroup=g;lastRole=msg.role;
      }
    }
  }
  flushTasks();

  let html='';
  for(const g of groups){
    if(g.type==='sep'){html+=`<div class="time-sep">${g.label}</div>`;}
    else if(g.type==='tasks'){
      if(g.items.length===1){
        html+=`<div class="task-group"><div class="task-row"><span class="task-ico">${ico(g.items[0].text)}</span><span class="task-txt">${esc(g.items[0].text)}</span></div></div>`;
      }else{
        html+=`<div class="task-group"><div class="task-stack">`;
        for(const t of g.items)html+=`<div class="task-row"><span class="task-ico">${ico(t.text)}</span><span class="task-txt">${esc(t.text)}</span></div>`;
        html+=`</div></div>`;
      }
    }else{
      const isU=g.role==='user';
      const avHtml=isU
        ?`<div class="av me">我</div>`
        :`<div class="av cc">Cc</div>`;

      let bubblesHtml='';
      for(let i=0;i<g.bubbles.length;i++){
        const msg=g.bubbles[i];
        const isLast=i===g.bubbles.length-1;
        const starred=favIds.has(msg.id);

        let thinkHtml='';
        if(!isU&&msg.thinking){
          const prev=msg.thinking.slice(0,45);
          thinkHtml=`<div class="think-chip" onclick="this.classList.toggle('open')">
            <div class="think-hdr">💭 <span style="font-weight:normal;color:#5a5248">${esc(prev)}${msg.thinking.length>45?'…':''}</span></div>
            <div class="think-body">${esc(msg.thinking)}</div>
          </div>`;
        }

        bubblesHtml+=`
          <div class="bubble-wrap">
            ${!isU&&msg.thinking?thinkHtml:''}
            <div class="bubble ${g.role}">${renderSegs(msg.text||'')}</div>
            <div class="bact">
              <button class="bab${starred?' on':''}" onclick="toggleFav('${ea(msg.id)}','${ea(msg.text)}','${g.role}','${ea(msg.timestamp||'')}',this)" title="${starred?'取消收藏':'收藏'}">${starred?'★':'☆'}</button>
              <button class="bab" onclick="cpTxt('${ea(msg.text)}')" title="复制">⎘</button>
            </div>
          </div>`;
      }
      const lastMsg=g.bubbles[g.bubbles.length-1];
      bubblesHtml+=`<div class="bts">${fmtTs(lastMsg.timestamp)}</div>`;

      html+=`<div class="msg-group ${g.role}">${avHtml}<div class="bubbles">${bubblesHtml}</div></div>`;
    }
  }

  chatEl.innerHTML=html;
  scrollBot();
}

// ── Poll chat ─────────────────────────────────────────────────────────────
async function pollChat(){
  try{
    let newMsgs=[],statusData=null;
    const since=lastTs?`&since=${encodeURIComponent(lastTs)}`:'';
    try{
      const data=await api(`/chat/poll?limit=50${since}`);
      if(Array.isArray(data))newMsgs=data;
      else{newMsgs=data.messages||[];statusData=data.status;}
    }catch(_){
      try{newMsgs=await api(`/chat/history?limit=100${since}`);}catch(_2){}
    }
    if(!statusData){try{statusData=await api('/chat/status');}catch(_){}}

    const wasThink=isThink;
    isThink=!!(statusData?.typing||statusData?.thinking||statusData?.status==='thinking');
    const thinkBar=document.getElementById('think-bar');
    const dot=document.getElementById('dot');
    if(isThink){
      dot.className='busy';thinkBar.classList.add('on');
      if(!wasThink){verbIdx=0;clearInterval(verbTmr);verbTmr=setInterval(()=>{verbIdx=(verbIdx+1)%VERBS.length;document.getElementById('think-verb').textContent=VERBS[verbIdx];},2500);}
    }else{
      dot.className='';thinkBar.classList.remove('on');clearInterval(verbTmr);verbTmr=null;
    }

    if(newMsgs.length){
      const ids=new Set(msgs.map(m=>m.id));
      let changed=!lastTs;
      for(const m of newMsgs){
        if(!ids.has(m.id)){msgs.push(m);ids.add(m.id);changed=true;}
        if(m.isFavorited)favIds.add(m.id);
      }
      msgs.sort((a,b)=>{
        const ta=new Date(a.timestamp||0).getTime(),tb=new Date(b.timestamp||0).getTime();
        return ta-tb||(a.id>b.id?1:-1);
      });
      const last=msgs[msgs.length-1];
      if(last?.timestamp)lastTs=last.timestamp;
      if(changed)renderChat();
    }

    document.getElementById('hdr-st').textContent='在线 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('dot').className='off';
    document.getElementById('hdr-st').textContent='离线';
  }
}

// ── Send chat ─────────────────────────────────────────────────────────────
const chatInp=document.getElementById('chat-inp');
const sendBtn=document.getElementById('send-btn');

async function sendChat(){
  const text=chatInp.value.trim();
  if(!text||sendBtn.disabled)return;
  if(text.startsWith('/')){chatInp.value='';autoResize();document.getElementById('slash-pop').classList.remove('on');await handleSlash(text);return;}
  chatInp.value='';autoResize();sendBtn.disabled=true;
  const local={id:'local-'+Date.now(),role:'user',text,timestamp:new Date().toISOString()};
  msgs.push(local);renderChat();scrollBot(true);
  try{
    await api('/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  }catch(e){
    toast('发送失败: '+e.message);
    msgs=msgs.filter(m=>m.id!==local.id);renderChat();
  }finally{sendBtn.disabled=false;chatInp.focus();}
}

function autoResize(){
  chatInp.style.height='auto';
  chatInp.style.height=Math.min(chatInp.scrollHeight,130)+'px';
}

// ── Slash commands ────────────────────────────────────────────────────────
async function handleSlash(text){
  const[base,...args]=text.trim().split(/\s+/);
  const post=(path,body)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  try{
    if(base==='/new'){await post('/chain/new_session',{});toast('已新建会话');}
    else if(base==='/stop'){await post('/chain/abort',{});toast('已中止');}
    else if(base==='/clear'){await post('/chain/clear',{});msgs=[];lastTs=null;renderChat();toast('已清空');}
    else if(base==='/list'){const d=await api('/chain/sessions');const s=d.sessions||d;toast('共 '+((Array.isArray(s)?s:[]).length)+' 个会话');}
    else if(base==='/switch'){if(!args[0]){toast('用法: /switch <id>');return;}await post('/chain/switch',{id:args[0]});toast('已切换');}
    else if(base==='/compact'){await post('/tmux/send',{keys:'/compact',session:termSess,enter:true});toast('已发送 /compact');}
    else toast('未知命令: '+base);
  }catch(e){toast('命令失败: '+e.message);}
}

const slashPop=document.getElementById('slash-pop');
chatInp.addEventListener('input',()=>{
  autoResize();
  const val=chatInp.value;
  if(val.startsWith('/')&&!val.includes(' ')){
    const q=val.slice(1).toLowerCase();
    const f=SLASH.filter(s=>s.cmd.slice(1).startsWith(q));
    if(f.length){slashSel=0;renderSlash(f);slashPop.classList.add('on');}
    else slashPop.classList.remove('on');
  }else slashPop.classList.remove('on');
});

function curSlash(){const v=chatInp.value;if(!v.startsWith('/'))return[];return SLASH.filter(s=>s.cmd.slice(1).startsWith(v.slice(1).toLowerCase()));}
function renderSlash(cmds){
  slashPop.innerHTML=cmds.map((c,i)=>
    `<div class="sl-item${i===slashSel?' sel':''}" onclick="applySlash('${c.cmd}')">
      <span class="sl-cmd">${c.cmd}</span><span class="sl-desc">${c.desc}</span>
    </div>`
  ).join('');
}
function applySlash(cmd){chatInp.value=cmd+' ';slashPop.classList.remove('on');chatInp.focus();}

chatInp.addEventListener('keydown',e=>{
  if(slashPop.classList.contains('on')){
    const f=curSlash();
    if(e.key==='ArrowDown'){e.preventDefault();slashSel=Math.min(slashSel+1,f.length-1);renderSlash(f);return;}
    if(e.key==='ArrowUp'){e.preventDefault();slashSel=Math.max(slashSel-1,0);renderSlash(f);return;}
    if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();if(f[slashSel])applySlash(f[slashSel].cmd);return;}
    if(e.key==='Escape'){slashPop.classList.remove('on');return;}
  }
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
});
sendBtn.addEventListener('click',sendChat);
function cpTxt(t){navigator.clipboard.writeText(t.replace(/\\n/g,'\n')).then(()=>toast('已复制'));}

// ── Favorites ─────────────────────────────────────────────────────────────
async function toggleFav(id,text,role,ts,btn){
  const on=favIds.has(id);
  try{
    if(on){await api('/chat/favorites/'+id,{method:'DELETE'});favIds.delete(id);btn.textContent='☆';btn.classList.remove('on');toast('已取消收藏');}
    else{
      await api('/chat/favorites',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({refs:[{id,role,text:text.replace(/\\n/g,'\n'),ts,type:'text'}],type:'text'})});
      favIds.add(id);btn.textContent='★';btn.classList.add('on');toast('已收藏');
    }
  }catch(e){toast('失败: '+e.message);}
}
async function loadFavs(){
  const el=document.getElementById('fav-list');
  el.innerHTML='<div class="empty"><div class="empty-ico">⭐</div><div>加载中…</div></div>';
  try{
    const data=await api('/chat/favorites');
    favs=Array.isArray(data)?data:(data.favorites||data.items||[]);
    renderFavs();
  }catch(e){el.innerHTML='<div class="empty"><div class="empty-ico">⭐</div><div>加载失败</div></div>';}
}
function renderFavs(){
  const el=document.getElementById('fav-list');
  if(!favs.length){el.innerHTML='<div class="empty"><div class="empty-ico">⭐</div><div>还没有收藏</div></div>';return;}
  el.innerHTML=favs.map(f=>{
    const isCc=f.role!=='user';
    const ts=fmtTs(f.ts||f.timestamp||f.created_at);
    const txt=(f.text||'').slice(0,500);
    return`<div class="fav-card">
      <div style="flex:1">
        <div class="fav-meta"><span class="fav-role ${isCc?'cc':'me'}">${isCc?'Cc':'我'}</span>${ts}</div>
        <div class="fav-txt">${esc(txt)}${(f.text||'').length>500?'…':''}</div>
      </div>
      <button class="fav-del" onclick="delFav('${ea(f.id)}',this)">✕</button>
    </div>`;
  }).join('');
}
async function delFav(id,btn){
  try{await api('/chat/favorites/'+id,{method:'DELETE'});favs=favs.filter(f=>f.id!==id);favIds.delete(id);renderFavs();toast('已删除');}
  catch(e){toast('删除失败');}
}

// ── Terminal ──────────────────────────────────────────────────────────────
async function loadTermSess(){
  try{
    const data=await api('/tmux/sessions');
    termList=data.sessions||[];
    if(!termList.length)return;
    if(!termList.find(s=>s.name===termSess))termSess=termList[0].name;
    document.getElementById('term-sess').innerHTML=termList.map(s=>
      `<button class="stab${s.name===termSess?' on':''}" onclick="selSess('${ea(s.name)}')">${esc(s.name)}</button>`
    ).join('');
  }catch(_){}
}
function selSess(n){termSess=n;document.querySelectorAll('.stab').forEach(b=>b.classList.toggle('on',b.textContent===n));pollTerm();}
async function pollTerm(){
  if(curTab!=='term')return;
  try{
    const data=await api(`/tmux/capture?session=${encodeURIComponent(termSess)}&lines=120`);
    if(data&&data.output!==undefined){
      document.getElementById('term-out').textContent=data.output;
      const w=document.getElementById('term-wrap');w.scrollTop=w.scrollHeight;
    }
  }catch(_){}
}
function startTermPoll(){stopTermPoll();pollTerm();termTmr=setInterval(pollTerm,1500);}
function stopTermPoll(){clearInterval(termTmr);termTmr=null;}

async function sendTerm(){
  const inp=document.getElementById('term-inp');const text=inp.value;if(!text)return;
  inp.value='';
  try{
    await api('/tmux/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keys:text,session:termSess,enter:true})});
    setTimeout(pollTerm,400);
  }catch(e){toast('发送失败: '+e.message);}
}
async function sendKey(key){
  try{
    await api('/tmux/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,session:termSess})});
    setTimeout(pollTerm,300);
  }catch(_){}
}
document.querySelectorAll('.kbtn').forEach(btn=>btn.addEventListener('click',async()=>{
  const keys=btn.dataset.keys,key=btn.dataset.key;
  if(keys){for(const k of keys.split(',')){{await sendKey(k);await new Promise(r=>setTimeout(r,80));}}
  }else sendKey(key);
}));
document.getElementById('term-inp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendTerm();}});
document.getElementById('term-sbtn').addEventListener('click',sendTerm);

// ── Init ──────────────────────────────────────────────────────────────────
pollChat();
setInterval(pollChat,2000);
</script>
