<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Claude Code</title>
<style>
:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --surface2: #1e1e1e;
  --surface3: #252525;
  --border: #2a2a2a;
  --text: #e0e0e0;
  --text-dim: #777;
  --accent: #d96d36;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #fbbf24;
  --font: -apple-system, "PingFang SC", "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; display: flex; flex-direction: column; }

/* ── Header ── */
.hdr {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); transition: background .4s; }
.dot.off { background: var(--red); }
.dot.busy { background: var(--yellow); }
.hdr-title { font-weight: 700; font-size: 16px; letter-spacing: -.3px; }
.hdr-sub { color: var(--text-dim); font-size: 12px; margin-left: auto; }

/* ── Tabs ── */
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab {
  flex: 1; padding: 10px 0; text-align: center;
  font-size: 13px; font-weight: 500; color: var(--text-dim);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: color .2s, border-color .2s;
}
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Views ── */
.view { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
.view.on { display: flex; }

/* ── Messages ── */
.msgs {
  flex: 1; overflow-y: auto; padding: 16px 14px;
  display: flex; flex-direction: column; gap: 14px;
  scroll-behavior: smooth;
}
.msgs::-webkit-scrollbar { width: 3px; }
.msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg { display: flex; flex-direction: column; max-width: 82%; }
.msg.u { align-self: flex-end; align-items: flex-end; }
.msg.a { align-self: flex-start; align-items: flex-start; }
.msg-who { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
.bubble {
  padding: 10px 14px; border-radius: 18px;
  line-height: 1.6; word-break: break-word; white-space: pre-wrap;
}
.msg.u .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.a .bubble { background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; }
.bubble pre {
  background: #0a0a0a; border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; margin: 8px -2px;
  overflow-x: auto; font-family: var(--mono); font-size: 12.5px;
  white-space: pre; line-height: 1.5;
}
.bubble code { font-family: var(--mono); font-size: 12.5px; }
.msg.a .bubble p { margin: 4px 0; }
.msg.a .bubble p:first-child { margin-top: 0; }
.msg.a .bubble p:last-child { margin-bottom: 0; }
.msg-ts { font-size: 10px; color: var(--text-dim); margin-top: 3px; }

/* thinking dots */
.thinking { display: flex; gap: 5px; align-items: center; padding: 12px 16px; background: var(--surface2); border-radius: 18px; border-bottom-left-radius: 4px; }
.thinking b { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); animation: blink 1.2s infinite; }
.thinking b:nth-child(2) { animation-delay: .2s; }
.thinking b:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,60%,100% { opacity: .3; transform: scale(1); } 30% { opacity: 1; transform: scale(1.2); } }

.empty { text-align: center; color: var(--text-dim); padding: 60px 20px; margin: auto; line-height: 2; }
.empty .icon { font-size: 40px; margin-bottom: 12px; }

/* ── Input area ── */
.inp-wrap {
  flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 12px; position: relative;
  padding-bottom: max(10px, calc(10px + env(safe-area-inset-bottom)));
}
.inp-row { display: flex; gap: 8px; align-items: flex-end; }
.inp {
  flex: 1; background: var(--surface3); color: var(--text);
  border: 1.5px solid var(--border); border-radius: 22px;
  padding: 10px 16px; font: inherit; font-size: 15px;
  resize: none; outline: none;
  min-height: 44px; max-height: 140px; line-height: 1.4;
  transition: border-color .2s;
}
.inp:focus { border-color: var(--accent); }
.inp::placeholder { color: var(--text-dim); }
.sbtn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); border: 0; color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity .2s, transform .1s;
}
.sbtn:active { transform: scale(.92); }
.sbtn:disabled { opacity: .35; cursor: default; }
.sbtn svg { width: 18px; height: 18px; }

/* ── Slash popup ── */
.slash-pop {
  display: none; position: absolute; bottom: 100%; left: 0; right: 0;
  background: var(--surface2); border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  max-height: 220px; overflow-y: auto; z-index: 50;
}
.slash-pop.show { display: block; }
.slash-item {
  display: flex; gap: 12px; align-items: center;
  padding: 11px 16px; cursor: pointer; transition: background .15s;
}
.slash-item:hover, .slash-item.sel { background: var(--surface3); }
.slash-cmd { color: var(--accent); font-family: var(--mono); font-size: 13px; font-weight: 600; min-width: 80px; }
.slash-desc { color: var(--text-dim); font-size: 13px; }

/* ── Terminal ── */
.term {
  flex: 1; overflow-y: auto; padding: 14px 16px;
  font-family: var(--mono); font-size: 13px; line-height: 1.6;
  background: #000; color: #c8c8c8; white-space: pre-wrap; word-break: break-all;
}
.term::-webkit-scrollbar { width: 3px; }
.term::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface3); border: 1px solid var(--border);
  padding: 8px 16px; border-radius: 20px; font-size: 13px; color: var(--text);
  opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="hdr">
  <span class="dot" id="dot"></span>
  <span class="hdr-title">Claude Code</span>
  <span class="hdr-sub" id="sub">连接中...</span>
</div>

<div class="tabs">
  <div class="tab on" id="tab-chat" onclick="switchTab('chat')">💬 聊天</div>
  <div class="tab" id="tab-term" onclick="switchTab('term')">⌨️ 终端</div>
</div>

<!-- Chat -->
<div class="view on" id="view-chat">
  <div class="msgs" id="msgs">
    <div class="empty">
      <div class="icon">🤖</div>
      <div>发消息开始对话</div>
      <div style="font-size:13px">输入 / 查看可用命令</div>
    </div>
  </div>
  <div class="inp-wrap">
    <div class="slash-pop" id="slash-pop"></div>
    <div class="inp-row">
      <textarea class="inp" id="inp" placeholder="发消息... (输入 / 查看命令)" rows="1"></textarea>
      <button class="sbtn" id="sbtn" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Terminal -->
<div class="view" id="view-term">
  <div class="term" id="term">正在连接...</div>
  <div class="inp-wrap">
    <div class="inp-row">
      <textarea class="inp" id="term-inp" placeholder="发送到终端 (Enter 发送)" rows="1"></textarea>
      <button class="sbtn" id="term-sbtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── injected by server ──
const AUTH_TOKEN = null;

// ── slash commands ──
const CMDS = [
  { cmd: '/new',     desc: '新建对话' },
  { cmd: '/list',    desc: '列出所有会话' },
  { cmd: '/switch',  desc: '切换会话 (需要加会话 ID)' },
  { cmd: '/stop',    desc: '停止当前任务' },
  { cmd: '/compact', desc: '压缩对话历史' },
  { cmd: '/clear',   desc: '清屏' },
  { cmd: '/help',    desc: '查看帮助' },
  { cmd: '/model',   desc: '查看/切换模型' },
];

// ── elements ──
const msgsEl   = document.getElementById('msgs');
const inpEl    = document.getElementById('inp');
const sbtnEl   = document.getElementById('sbtn');
const dotEl    = document.getElementById('dot');
const subEl    = document.getElementById('sub');
const slashPop = document.getElementById('slash-pop');
const termEl   = document.getElementById('term');
const termInp  = document.getElementById('term-inp');
const termSbtn = document.getElementById('term-sbtn');
const toastEl  = document.getElementById('toast');

// ── state ──
let lastTs    = null;
let seenKeys  = new Set();
let isEmpty   = true;
let thinking  = false;
let thinkEl   = null;
let slashSel  = -1;
let slashList = [];
let currentTab = 'chat';
let termPollTs = null;

// ── helpers ──
function fmtTime(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  } catch { return ''; }
}

function toast(msg, dur = 2000) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), dur);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMd(text) {
  // code blocks
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${escHtml(code.trim())}</code></pre>`;
  });
  // inline code
  text = text.replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`);
  // bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // paragraphs (split on double newline)
  const parts = text.split(/\n\n+/);
  if (parts.length > 1) {
    return parts.map(p => `<p>${p}</p>`).join('');
  }
  return text;
}

async function apiFetch(path, opts = {}) {
  const headers = { 'X-Auth-Token': AUTH_TOKEN || '', ...(opts.headers || {}) };
  const res = await fetch(path, { ...opts, headers, cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ── status dot ──
function setStatus(state, text) {
  dotEl.className = 'dot' + (state === 'off' ? ' off' : state === 'busy' ? ' busy' : '');
  subEl.textContent = text;
}

// ── tabs ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.getElementById('view-' + tab).classList.add('on');
  document.getElementById('tab-' + tab).classList.add('on');
  if (tab === 'term') pollTerm();
}

// ── thinking indicator ──
function showThinking() {
  if (thinking) return;
  thinking = true;
  thinkEl = document.createElement('div');
  thinkEl.className = 'msg a';
  thinkEl.innerHTML = '<div class="thinking"><b></b><b></b><b></b></div>';
  msgsEl.appendChild(thinkEl);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function hideThinking() {
  if (!thinking) return;
  thinking = false;
  if (thinkEl) { thinkEl.remove(); thinkEl = null; }
}

// ── render message ──
function renderMsg(r) {
  const isUser = r.role === 'user';
  const text = (r.text || '').trim();
  if (!text) return;
  const key = (r.ts || '') + '|' + r.role + '|' + text.slice(0, 80);
  if (seenKeys.has(key)) return;
  seenKeys.add(key);

  if (isEmpty) {
    msgsEl.innerHTML = '';
    isEmpty = false;
  }
  hideThinking();

  const div = document.createElement('div');
  div.className = 'msg ' + (isUser ? 'u' : 'a');

  const who = document.createElement('div');
  who.className = 'msg-who';
  who.textContent = isUser ? '你' : 'Claude';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (isUser) {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = renderMd(text);
  }

  const ts = document.createElement('div');
  ts.className = 'msg-ts';
  ts.textContent = fmtTime(r.ts);

  div.appendChild(who);
  div.appendChild(bubble);
  div.appendChild(ts);
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

// ── chat poll ──
async function pollChat() {
  try {
    const url = lastTs
      ? `/chat/history?since=${encodeURIComponent(lastTs)}`
      : '/chat/history?limit=100';
    const data = await apiFetch(url);
    if (data.ok && Array.isArray(data.records)) {
      for (const r of data.records) {
        renderMsg(r);
        if (r.ts && (!lastTs || r.ts > lastTs)) lastTs = r.ts;
      }
      setStatus('on', '在线 · ' + (lastTs ? fmtTime(lastTs) : '--'));
    }

    // check if claude is thinking
    try {
      const status = await apiFetch('/chat/status');
      if (status.thinking || status.active) showThinking();
      else hideThinking();
    } catch {}

  } catch (e) {
    setStatus('off', '断线 重试中');
  }
}

// ── terminal poll ──
async function pollTerm() {
  if (currentTab !== 'term') return;
  try {
    const data = await apiFetch('/tmux/capture?session=cc&lines=120');
    if (data && data.output !== undefined) {
      termEl.textContent = data.output;
    }
  } catch (e) {
    // ignore
  }
}

// ── send chat ──
async function sendChat() {
  const text = inpEl.value.trim();
  if (!text) return;
  sbtnEl.disabled = true;
  inpEl.value = '';
  autoResize(inpEl);
  closeSlash();

  // optimistic render
  renderMsg({ role: 'user', text, ts: new Date().toISOString() });

  try {
    await apiFetch('/chat/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    showThinking();
    setTimeout(pollChat, 800);
  } catch (e) {
    toast('发送失败: ' + e.message);
  } finally {
    sbtnEl.disabled = false;
    inpEl.focus();
  }
}

// ── send terminal ──
async function sendTerm() {
  const text = termInp.value;
  if (!text) return;
  termInp.value = '';
  try {
    await apiFetch('/tmux/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keys: text, session: 'cc', enter: true }),
    });
    setTimeout(pollTerm, 500);
  } catch (e) {
    toast('发送失败: ' + e.message);
  }
}

// ── slash commands ──
function openSlash(filter) {
  slashList = CMDS.filter(c => c.cmd.startsWith(filter));
  if (!slashList.length) { closeSlash(); return; }
  slashSel = -1;
  slashPop.innerHTML = slashList.map((c, i) =>
    `<div class="slash-item" data-i="${i}" onclick="selectSlash(${i})">
      <span class="slash-cmd">${escHtml(c.cmd)}</span>
      <span class="slash-desc">${escHtml(c.desc)}</span>
    </div>`
  ).join('');
  slashPop.classList.add('show');
}

function closeSlash() {
  slashPop.classList.remove('show');
  slashList = [];
  slashSel = -1;
}

function selectSlash(i) {
  const cmd = slashList[i];
  if (!cmd) return;
  inpEl.value = cmd.cmd + (cmd.cmd === '/switch' ? ' ' : '');
  closeSlash();
  inpEl.focus();
  const len = inpEl.value.length;
  inpEl.setSelectionRange(len, len);
}

function highlightSlash(i) {
  slashSel = i;
  slashPop.querySelectorAll('.slash-item').forEach((el, idx) => {
    el.classList.toggle('sel', idx === i);
  });
}

// ── auto resize textarea ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

// ── events ──
inpEl.addEventListener('input', () => {
  autoResize(inpEl);
  sbtnEl.disabled = !inpEl.value.trim();
  const val = inpEl.value;
  if (val.startsWith('/') && !val.includes(' ')) {
    openSlash(val);
  } else {
    closeSlash();
  }
});

inpEl.addEventListener('keydown', e => {
  if (slashPop.classList.contains('show')) {
    if (e.key === 'ArrowDown') { e.preventDefault(); highlightSlash((slashSel + 1) % slashList.length); return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); highlightSlash((slashSel - 1 + slashList.length) % slashList.length); return; }
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      if (slashSel >= 0) selectSlash(slashSel);
      else if (slashList.length === 1) selectSlash(0);
      return;
    }
    if (e.key === 'Escape') { closeSlash(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});

sbtnEl.addEventListener('click', sendChat);

termInp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendTerm();
  }
});
termSbtn.addEventListener('click', sendTerm);
termInp.addEventListener('input', () => autoResize(termInp));

// ── kick off ──
pollChat();
setInterval(pollChat, 2500);
setInterval(() => { if (currentTab === 'term') pollTerm(); }, 3000);

inpEl.focus();
</script>
</body>
</html>
